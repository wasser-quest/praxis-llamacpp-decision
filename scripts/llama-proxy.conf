# Same private NetBird frontend port; OpenAI-compatible API, NOT Ollama's API.
worker_processes 1;
pid /workspace/llama-proxy.pid;
error_log /workspace/logs/llama-proxy.log warn;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:11434;
        server_name _;
        client_max_body_size 64m;
        # API-only: browser pages cannot drive this unauthenticated VPN backend.
        if ($http_origin != "") { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        send_timeout 1800s;
        location = /v1/embeddings {
            proxy_set_header Host 127.0.0.1:11436;
            proxy_pass http://127.0.0.1:11436;
        }
        location = /health/embedding {
            proxy_set_header Host 127.0.0.1:11436;
            proxy_pass http://127.0.0.1:11436/health;
        }
        location = /health {
            proxy_set_header Host 127.0.0.1:11435;
            proxy_pass http://127.0.0.1:11435;
        }
        # Read-only introspection. Do not expose POST /props mutations.
        location = /props {
            limit_except GET { deny all; }
            proxy_set_header Host 127.0.0.1:11435;
            proxy_pass http://127.0.0.1:11435;
        }
        location = /metrics {
            limit_except GET { deny all; }
            proxy_set_header Host 127.0.0.1:11435;
            proxy_pass http://127.0.0.1:11435;
        }
        location = /v1/models {
            proxy_set_header Host 127.0.0.1:11435;
            proxy_pass http://127.0.0.1:11435;
        }
        location = /v1/chat/completions {
            proxy_set_header Host 127.0.0.1:11435;
            proxy_pass http://127.0.0.1:11435;
        }
        location / { return 404; }
    }
}
